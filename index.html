<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Note Taker</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <h1>Quick Note Log</h1>
      <p class="hint">Type a note and press Enter to add it to the table.</p>

      <label for="noteInput" class="sr-only">Write a note</label>
      <textarea
        id="noteInput"
        rows="4"
        placeholder="Type your note here and press Enter to save..."
      ></textarea>

      <section class="table-wrap" aria-label="Saved notes">
        <table>
          <thead>
            <tr>
              <th scope="col">Note</th>
              <th scope="col">Created At</th>
              <th scope="col">Actions</th>
            </tr>
          </thead>
          <tbody id="notesTableBody">
            <tr id="emptyStateRow">
              <td colspan="3" class="empty-state">No notes yet.</td>
            </tr>
          </tbody>
        </table>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
